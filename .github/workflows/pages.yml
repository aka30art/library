name: Validate and deploy AI Prompt Library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate each PR from production pushes so preview validation cannot cancel
  # an active GitHub Pages deployment (and vice versa).
  group: pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalogue and page wiring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify catalogue integrity
        run: node scripts/validate-catalogue.cjs
      - name: Test Phase B1 Materials prototype suite
        run: node scripts/test-materials-prototype.cjs
      - name: Test Materials catalogue architecture v2
        run: node scripts/test-materials-catalogue.cjs
      - name: Test Styles catalogue architecture v2
        run: node scripts/test-styles-catalogue.cjs
      - name: Report prompt-quality diagnostics
        run: node scripts/audit-prompt-quality.cjs

  branch-browser-tests:
    name: PR browser QA (local branch, no deployment)
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8000 > /tmp/library-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail http://127.0.0.1:8000/ >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/ >/dev/null
      - name: Test branch website interactions (desktop and mobile)
        env:
          SITE_URL: http://127.0.0.1:8000/
        run: node scripts/browser-smoke-test.cjs
      - name: Test Randomiser interactions (mobile)
        env:
          SITE_URL: http://127.0.0.1:8000/
        run: node scripts/randomiser-smoke-test.cjs
      - name: Test Materials Explore, Builder and Randomiser integration
        env:
          SITE_URL: http://127.0.0.1:8000/
        run: node scripts/materials-browser-smoke-test.cjs
      - name: Test Styles Explore, Builder and Randomiser integration
        env:
          SITE_URL: http://127.0.0.1:8000/
        run: node scripts/styles-browser-smoke-test.cjs

  # Separate artifact preparation from deployment to avoid the intermittent
  # artifact-registration race between upload-pages-artifact and deploy-pages.
  prepare-pages:
    name: Prepare GitHub Pages artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: prepare-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  browser-smoke-test:
    name: Browser smoke tests (mobile + desktop)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live website interactions
        env:
          SITE_URL: https://aka30art.github.io/library/
        run: node scripts/browser-smoke-test.cjs
  randomiser-browser-test:
    name: Randomiser mobile interaction tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify deployed Randomiser interactions
        env:
          SITE_URL: https://aka30art.github.io/library/
        run: node scripts/randomiser-smoke-test.cjs
