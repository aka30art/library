name: Screenworld Prototype QA
on:
  pull_request:
    paths:
      - screenworld-engine.js
      - tests/screenworld-engine.test.js
      - .github/workflows/screenworld-prototype.yml
  push:
    branches:
      - b5-screenworld-prototype
    paths:
      - screenworld-engine.js
      - tests/screenworld-engine.test.js
      - .github/workflows/screenworld-prototype.yml
jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source-destination matrix
        run: node tests/screenworld-engine.test.js
