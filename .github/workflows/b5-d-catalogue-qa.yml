name: B5-D Catalogue Batch QA
on:
  pull_request:
    paths:
      - 'screenworld-*-v2.json'
      - 'tests/b5-d-catalogue-batches.test.cjs'
      - 'tests/b5-d-screenworld-integration.test.cjs'
      - '.github/workflows/b5-d-catalogue-qa.yml'
  push:
    branches: [b5-d-screenworld-catalogue-rebuild, main]
    paths:
      - 'screenworld-*-v2.json'
      - 'tests/b5-d-catalogue-batches.test.cjs'
      - '.github/workflows/b5-d-catalogue-qa.yml'
jobs:
  catalogue-batches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/b5-d-catalogue-batches.test.cjs
      - run: node tests/b5-d-screenworld-integration.test.cjs
